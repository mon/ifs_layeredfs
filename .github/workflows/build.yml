name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: docker
          load: true
          tags: layeredfs/deps
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker 29's default seccomp profile breaks 32-bit wine (socket -> ENOSYS)
      - name: Build
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/work" layeredfs/deps bash build.sh

      - name: Test
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/work" layeredfs/deps bash test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.zip
